<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7ff">
<title>Trilha do Traço</title>
<style>
:root{color-scheme:light;--paper:#f8f7ff;--ink:#211749;--muted:#625978;--purple:#5224c3;--lavender:#eae2fc;--border:#e5dff1;--green:#086747;--gold:#ffd470}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
[hidden]{display:none!important}
.top{background:#fff;border-bottom:1px solid var(--border)}
.top-inner{max-width:880px;margin:auto;min-height:57px;padding:8px 17px;display:flex;align-items:center;justify-content:space-between;gap:7px}
.brand,.score{display:flex;align-items:center;gap:8px;font-weight:850;white-space:nowrap}
.brand-mark{width:33px;height:33px;border-radius:10px;background:var(--purple);display:grid;place-items:center;color:white;transform:rotate(-6deg)}
.brand-mark svg{width:21px;height:21px}
.score{font-size:.84rem;background:#fff1cd;color:#6b4204;padding:6px 10px;border-radius:50px}
.star{width:17px;height:17px;flex:none;fill:var(--gold);stroke:#975800;stroke-width:1.6;stroke-linejoin:round}
main{max-width:880px;margin:auto;padding:15px 14px 20px}
.intro{position:relative;isolation:isolate;overflow:hidden;min-height:123px;border-radius:23px;background:#29165d;color:white;padding:14px 18px 16px;display:flex;align-items:center}
.intro-text{z-index:1}
.eyebrow{margin:0 0 4px;color:#decfff;font-size:.65rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1,h2,p{margin:0}
h1{font-size:clamp(1.65rem,6.5vw,2.65rem);line-height:1.03;font-weight:900;letter-spacing:-.055em}
.intro p:last-child{margin-top:7px;color:#f0e8ff;font-size:.84rem;max-width:16rem}
.mascot{position:absolute;right:3px;bottom:0;height:100%;width:32%;max-width:190px;pointer-events:none}
.layout{display:grid;gap:12px;margin-top:12px}
.sidebar{display:grid;gap:9px;align-content:start;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{display:flex;align-items:center;text-align:left;gap:8px;min-width:0;min-height:51px;background:white;color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:5px 8px;line-height:1.1}
.mode[aria-pressed="true"]{background:#eee6ff;border-color:#a78be7}
.mode-icon{display:grid;place-items:center;flex:none;background:#e8defb;color:#482599;border-radius:8px;width:32px;height:32px;font-weight:900;font-size:.82rem}
.mode[data-mode="numbers"] .mode-icon{background:#d8f4ea;color:#145840}
.mode-title{display:block;font-weight:850;font-size:.92rem}
.mode-count{display:block;color:var(--muted);font-size:.68rem;margin-top:3px}
.progress{list-style:none;display:flex;align-items:center;gap:5px;margin:0;padding:0;min-width:0}
.progress li{height:27px;min-width:0;width:30px;display:grid;place-items:center;background:#ebe7f2;color:#615675;border-radius:7px;font-weight:800;font-size:.73rem}
.progress li[aria-current]{color:white;background:var(--purple)}
.progress .done{background:#d9f4e7;color:#105c40}
.guide{display:none}
.game{min-width:0;background:#fff;border:1px solid var(--border);border-radius:20px;padding:11px;box-shadow:0 8px 24px #321b6310}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 8px}
.stage-info{min-width:0}
.game-kicker{color:var(--purple);font-weight:850;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
h2{margin-top:2px;font-size:1.27rem;letter-spacing:-.035em}
.step{display:inline-block;font-size:.74rem;color:#482599;font-weight:850;background:#eee6ff;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pad{display:block;width:100%;height:clamp(240px,calc(100svh - 402px),385px);min-height:240px;background-color:#fcfaff;background-image:radial-gradient(#dfd5ee 1px,transparent 1px);background-size:14px 14px;border:2px solid #e9e0f6;border-radius:15px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.pad path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.guide-lane{stroke:#f0eaf9;stroke-width:52}
.guide-lane.current{stroke:#e7d9ff}
.guide-dots{stroke:#8c70c5;stroke-width:5;stroke-dasharray:.1 11}
.guide-dots.current{stroke:#5b37a7}
.ink{stroke:#6738dd;stroke-width:17}
.ink.complete{stroke:#0b926a}
.marker circle{fill:var(--purple);stroke:#fff;stroke-width:2.5}
.marker text{fill:#fff;font:850 12px system-ui;text-anchor:middle;dominant-baseline:central}
.marker path{stroke:var(--purple);stroke-width:2.5}
.sound-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.listen{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:100px;border:1px solid #d7c8f1;border-radius:11px;background:#eee6ff;color:#482599;padding:8px 12px;font-weight:850;font-size:.84rem}
.listen svg{width:19px;height:19px;flex:none}
.listen[data-state="playing"]{background:#dff5e8;color:#086747;border-color:#a1d2b3}
.listen:disabled{color:#777083;background:#f7f5fa}
.sound-note{margin:0 0 8px;font-size:.76rem;color:#783e0d}
.game-footer{margin-top:8px}
.feedback{display:flex;align-items:center;gap:7px;min-height:39px;background:#f3eefc;border-radius:10px;padding:6px 9px;color:#433063;font-size:.79rem;font-weight:680}
.feedback[data-tone="error"]{background:#fff1de;color:#783e0d}
.feedback[data-tone="success"]{background:#e1f6ea;color:var(--green)}
.feedback-icon{font-size:1rem;flex:none;font-weight:900}
.action{flex-shrink:0;min-height:44px;border-radius:11px;padding:8px 10px;font-size:.84rem;font-weight:850;border:1px solid #d7c8f1;background:white;color:#4e2a99}
.action.primary{background:var(--purple);border-color:var(--purple);color:white}
.action:active,.mode:active{transform:translateY(1px)}
.action:disabled{color:#777083;background:#f7f5fa;cursor:default}
.celebration{min-height:218px;display:grid;align-content:center;justify-items:center;text-align:center;padding:20px 14px;background:#f3ecff;border-radius:15px;color:#38216d}
.medal{width:66px;height:66px;border-radius:50%;background:#ffdf8e;display:grid;place-items:center;margin-bottom:10px}
.medal .star{width:40px;height:40px;fill:#fff5bf}
.celebration strong{font-size:1.45rem}
.celebration p{margin-top:5px;font-size:.9rem}
@media(min-width:730px){
  main{padding:22px 22px 30px}
  .intro{min-height:151px;padding:20px 27px}
  .intro p:last-child{max-width:none;font-size:1rem}
  .mascot{right:26px}
  .layout{grid-template-columns:224px minmax(0,1fr);gap:16px;margin-top:16px}
  .sidebar{gap:13px}
  .modes{grid-template-columns:1fr}
  .mode{min-height:61px;padding:8px 11px}
  .mode-icon{width:37px;height:37px}
  .progress{flex-wrap:wrap}
  .guide{display:block;border-radius:15px;border:1px solid var(--border);padding:12px;background:#fff;font-size:.81rem;color:var(--muted)}
  .guide strong{display:block;color:var(--ink);margin-bottom:4px}
  .game{padding:14px}
  .pad{height:clamp(300px,calc(100svh - 380px),415px)}
}
@media(max-width:360px){.intro{min-height:111px}.intro p:last-child{max-width:12rem}.mascot{width:30%}}
</style>
</head>

</header>
<main>

      </g>
    </svg>
  </section>
  <div class="layout">
    <aside class="sidebar" aria-label="Escolha e progresso da trilha">
      <div class="modes" aria-label="Trilhas" role="group">
        <button type="button" class="mode" data-mode="vowels" aria-pressed="true"><span class="mode-icon" aria-hidden="true">Aa</span><span><span class="mode-title">Vogais</span><span class="mode-count" id="vowel-count">0 de 5</span></span></button>
        <button type="button" class="mode" data-mode="numbers" aria-pressed="false"><span class="mode-icon" aria-hidden="true">123</span><span><span class="mode-title">Números</span><span class="mode-count" id="number-count">0 de 10</span></span></button>
      </div>
      <ol class="progress" id="progress" aria-label="Fases da trilha"></ol>
      <div class="guide"><strong>Como jogar</strong>Comece na bolinha e siga a seta. Pode levantar o dedo e voltar à bolinha para continuar.</div>
    </aside>
    <section class="game" aria-labelledby="stage-title">
      <div class="game-top">
        <div class="stage-info">
          <p class="game-kicker" id="stage-number"></p>
          <h2 id="stage-title"></h2>
        </div>
        <button type="button" id="action" class="action"></button>
      </div>
      <div class="sound-row" id="sound-row">
        <span class="step" id="step"></span>
        <button type="button" class="listen" id="listen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
          <span id="listen-text">Ouvir</span>
        </button>
      </div>
      <p class="sound-note" id="sound-note" role="status" hidden></p>
      <svg id="pad" class="pad" viewBox="23 10 274 228" role="img" aria-label="Área de traçado" aria-describedby="feedback"></svg>
      <div class="celebration" id="celebration" hidden>
        <span class="medal" aria-hidden="true"><svg class="star" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg></span>
        <strong id="celebration-title"></strong><p id="celebration-text"></p>
      </div>
      <div class="game-footer">
        <div class="feedback" id="feedback" role="status"><span class="feedback-icon" id="feedback-icon" aria-hidden="true"></span><span id="feedback-text"></span></div>
      </div>
    </section>
  </div>
  <noscript>Ative o JavaScript do navegador para jogar.</noscript>
</main>

function stopSound() {
  currentPlayback++;
  symbolPlayer.pause();
  byId('listen').dataset.state = 'ready';
}

function speakSymbol() {
  if (!audioEnabled || currentSymbol === null) return;
  stopSound();
  const playback = currentPlayback;
  symbolPlayer.src = pronunciations[currentSymbol];
  const showError = error => {
    if (currentPlayback !== playback || error?.name === 'AbortError') return;
    byId('listen').dataset.state = 'ready';
    byId('sound-note').textContent = error?.name === 'NotAllowedError' ?
      'Toque em Ouvir para ativar a pronúncia.' :
      'Não foi possível tocar o som. Toque em Ouvir para tentar novamente.';
    byId('sound-note').hidden = false;
  };
  symbolPlayer.onplaying = () => {
    if (currentPlayback !== playback) return;
    byId('listen').dataset.state = 'playing';
    byId('sound-note').hidden = true;
  };
  symbolPlayer.onended = () => {
    if (currentPlayback === playback) byId('listen').dataset.state = 'ready';
  };
  symbolPlayer.onerror = showError;
  try {
    const playing = symbolPlayer.play();
    playing?.catch(showError);
  } catch (error) {
    showError(error);
  }
}

function svg(name, attrs) {
  const element = document.createElementNS(svgNS, name);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  return element;
}

function feedback(message, tone = 'hint') {
  byId('feedback').dataset.tone = tone;
  byId('feedback-icon').textContent = {hint:'✦', error:'↺', success:'✓'}[tone];
  byId('feedback-text').textContent = message;
}

function setAction(label, primary = false, disabled = false) {
  action.textContent = label;
  action.classList.toggle('primary', primary);
  action.disabled = disabled;
}

function updateProgress() {
  const total = trails.vowels.completed + trails.numbers.completed;
  byId('score').textContent = total + ' / 15';
  byId('vowel-count').textContent = trails.vowels.completed + ' de 5';
  byId('number-count').textContent = trails.numbers.completed + ' de 10';
  for (const button of modes) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  const trail = trails[mode];
  byId('progress').replaceChildren(...trail.symbols.map((symbol, index) => {
    const item = document.createElement('li');
    item.textContent = symbol;
    if (index < trail.completed) {
      item.className = 'done';
      item.setAttribute('aria-label', symbol + ', concluído');
    } else if (index === trail.completed) {
      item.setAttribute('aria-current', 'step');
    }
    return item;
  }));
}

function renderStage() {
  clearTimeout(stageTimer);
  releasePointer();
  stopSound();
  earned = false;
  strokeIndex = 0;
  strokes = [];
  pad.replaceChildren();
  updateProgress();

  const trail = trails[mode];
  const symbol = trail.symbols[trail.completed];
  const finished = symbol === undefined;
  currentSymbol = finished ? null : symbol;
  byId('sound-row').hidden = finished;
  byId('sound-note').hidden = true;
  pad.hidden = finished;
  byId('celebration').hidden = !finished;
  byId('step').hidden = finished;
  if (finished) {
    const wonAll = trails.vowels.completed + trails.numbers.completed === 15;
    byId('stage-number').textContent = wonAll ? '15 de 15 estrelas' : 'Trilha concluída';
    byId('stage-title').textContent = wonAll ? 'Você venceu!' : 'Parabéns!';
    byId('celebration-title').textContent = wonAll ? 'Campeão do traço!' : mode === 'vowels' ? 'Vogais completas!' : 'Números completos!';
    byId('celebration-text').textContent = wonAll ? 'Você cobriu todas as vogais e todos os números.' : 'Você ganhou todas as estrelas desta trilha.';
    feedback(wonAll ? 'Todas as fases concluídas!' : 'Tem mais estrelas na outra trilha.', 'success');
    setAction(wonAll ? 'Jogar de novo' : mode === 'vowels' ? 'Jogar com números' : 'Jogar com vogais', true);
    return;
  }

  byId('stage-number').textContent = 'Fase ' + (trail.completed + 1) + ' de ' + trail.symbols.length;
  byId('stage-title').textContent = trail.label + ' ' + symbol;
  byId('listen-text').textContent = 'Ouvir ' + symbol;
  byId('listen').setAttribute('aria-label', 'Ouvir ' + trail.label.toLowerCase() + ' ' + symbol);
  pad.setAttribute('aria-label', 'Área de traçado para ' + trail.label.toLowerCase() + ' ' + symbol);
  strokes = paths[symbol].map(d => {
    const lane = svg('path', {d, class:'guide-lane'});
    pad.append(lane);
    const length = lane.getTotalLength();
    const segments = Math.ceil(length / sampleStep);
    const points = Array.from({length:segments + 1}, (_, index) => lane.getPointAtLength(index * length / segments));
    return {
      lane, length, points,
      dots:svg('path', {d, class:'guide-dots'}),
      ink:svg('path', {d, class:'ink', visibility:'hidden'})
    };
  });
  pad.append(...strokes.map(stroke => stroke.dots), ...strokes.map(stroke => stroke.ink));
  marker = svg('g', {class:'marker'});
  pad.append(marker);
  showStroke();
  speakSymbol();
}

function placeMarker() {
  const {points} = strokes[strokeIndex];
  const here = points[progressIndex];
  const ahead = points[Math.min(progressIndex + 11, points.length - 1)];
  const angle = Math.atan2(ahead.y - here.y, ahead.x - here.x) * 180 / Math.PI;
  marker.removeAttribute('visibility');
  marker.setAttribute('transform', 'translate(' + here.x + ' ' + here.y + ')');
  const arrow = svg('path', {d:'M18 0 H31 M26 -4 L31 0 L26 4', transform:'rotate(' + angle + ')'});
  const number = svg('text', {x:0, y:0});
  number.textContent = strokeIndex + 1;
  marker.replaceChildren(arrow, svg('circle', {cx:0, cy:0, r:14}), number);
}

function showStroke() {
  progressIndex = 0;
  strokes.forEach((stroke, index) => {
    stroke.lane.classList.toggle('current', index === strokeIndex);
    stroke.dots.classList.toggle('current', index === strokeIndex);
  });
  placeMarker();
  byId('step').textContent = 'Traço ' + (strokeIndex + 1) + ' de ' + strokes.length;
  feedback(strokeIndex ? 'Agora siga a bolinha ' + (strokeIndex + 1) + '.' : 'Siga a seta. Pode levantar o dedo e continuar.');
  setAction('Reiniciar fase', false, strokeIndex === 0);
}

function position(event, matrix) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix);
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function onStart(event) {
  if (active || earned || !event.isPrimary || event.button !== 0 || !strokes[strokeIndex]) return;
  const matrix = pad.getScreenCTM()?.inverse();
  if (!matrix) return;
  const point = position(event, matrix);
  const stroke = strokes[strokeIndex];
  if (distance(point, stroke.points[progressIndex]) > resumeRadius) {
    feedback('Toque na bolinha roxa para ' + (progressIndex ? 'continuar.' : 'começar.'), 'error');
    return;
  }
  event.preventDefault();
  pad.setPointerCapture(event.pointerId);
  active = {id:event.pointerId, previous:point, offGuide:false};
  marker.setAttribute('visibility', 'hidden');
  feedback('Siga o caminho até o fim.');
}

// Follow nearby checkpoints in order so pausing is allowed but skipping ahead earns no credit.
function record(point) {
  const {points} = strokes[strokeIndex];
  const previous = active.previous;
  const length = distance(previous, point);
  if (length < .5) return;
  const subdivisions = Math.ceil(length / sampleStep);
  for (let index = 1; index <= subdivisions; index++) {
    const fraction = index / subdivisions;
    const sample = {
      x:previous.x + (point.x - previous.x) * fraction,
      y:previous.y + (point.y - previous.y) * fraction
    };
    const next = Math.min(points.length - 1, progressIndex + 2);
    while (progressIndex < next && distance(sample, points[progressIndex + 1]) <= trailRadius) {
      progressIndex++;
    }
    const first = Math.max(0, progressIndex - 9);
    active.offGuide = true;
    for (let check = first; check <= progressIndex; check++) {
      if (distance(sample, points[check]) <= trailRadius) {
        active.offGuide = false;
        break;
      }
    }
  }
  active.previous = point;
}

function draw(event) {
  if (!active || event.pointerId !== active.id) return;
  const matrix = pad.getScreenCTM()?.inverse();
  if (!matrix) return;

  const before = progressIndex;
  const wasOutside = active.offGuide;
  for (const sample of event.getCoalescedEvents?.() ?? []) record(position(sample, matrix));
  record(position(event, matrix));

  const stroke = strokes[strokeIndex];
  const last = stroke.points.length - 1;
  if (progressIndex >= last - 3 && distance(active.previous, stroke.points[last]) <= endRadius) {
    finishStroke();
    return;
  }
  if (progressIndex !== before) {
    stroke.ink.setAttribute('stroke-dasharray', (stroke.length * progressIndex / last) + ' ' + stroke.length);
    stroke.ink.removeAttribute('visibility');
    if (action.disabled) setAction('Reiniciar fase');
  }
  if (active.offGuide) {
    if (!wasOutside || progressIndex !== before) placeMarker();
    if (!wasOutside) feedback('Volte para a bolinha. Seu traço ficou guardado.');
  } else if (wasOutside) {
    marker.setAttribute('visibility', 'hidden');
    feedback('Isso! Siga até o fim.');
  }
}

function releasePointer() {
  if (!active) return;
  const pointerId = active.id;
  active = null;
  if (pad.hasPointerCapture(pointerId)) pad.releasePointerCapture(pointerId);
}

function pauseStroke(event) {
  if (!active || event.pointerId !== active.id) return;
  releasePointer();
  placeMarker();
  feedback(progressIndex ? 'Continue da bolinha quando quiser.' : 'Siga a seta. Pode levantar o dedo e continuar.');
}

function finishStroke() {
  releasePointer();
  const stroke = strokes[strokeIndex];
  stroke.ink.removeAttribute('stroke-dasharray');
  stroke.ink.removeAttribute('visibility');
  stroke.ink.classList.add('complete');
  strokeIndex++;
  if (strokeIndex < strokes.length) {
    showStroke();
    return;
  }
  earned = true;
  marker.setAttribute('visibility', 'hidden');
  byId('step').textContent = 'Completo ✓';
  const trail = trails[mode];
  trail.completed++;
  updateProgress();
  feedback('Muito bem! Você ganhou uma estrela.', 'success');
  setAction('Continuar →', true);
  stageTimer = setTimeout(advanceStage, 1100);
}

byId('listen').addEventListener('click', () => {
  audioEnabled = true;
  speakSymbol();
});
document.addEventListener('pointerdown', event => {
  audioEnabled = true;
  if (!event.target.closest('#listen')) speakSymbol();
}, {once:true});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopSound();
});

pad.addEventListener('pointerdown', onStart);
pad.addEventListener('pointermove', draw);
pad.addEventListener('pointerup', event => {
  draw(event);
  pauseStroke(event);
});
pad.addEventListener('pointercancel', pauseStroke);
pad.addEventListener('lostpointercapture', pauseStroke);
for (const button of modes) {
  button.addEventListener('click', () => {
    if (mode === button.dataset.mode) return;
    mode = button.dataset.mode;
    renderStage();
  });
}
function advanceStage() {
  const otherMode = mode === 'vowels' ? 'numbers' : 'vowels';
  if (trails[mode].completed === trails[mode].symbols.length &&
      trails[otherMode].completed < trails[otherMode].symbols.length) {
    mode = otherMode;
  }
  renderStage();
}

action.addEventListener('click', () => {
  if (!earned && trails.vowels.completed + trails.numbers.completed === 15) {
    trails.vowels.completed = 0;
    trails.numbers.completed = 0;
    mode = 'vowels';
  }
  advanceStage();
});

renderStage();
</script>
</body>
</html>
